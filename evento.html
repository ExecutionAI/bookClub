  <div id="content" class="pt-12"><p class="text-crema-dim">Cargando…</p></div>
</main>

<script>
const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:3001' : 'https://entrebicisylibros.com';
const token = localStorage.getItem('bcToken');
const me = (() => { try { return JSON.parse(localStorage.getItem('bcMember')); } catch { return null; } })();
if (!token) location.href = 'login.html';

async function api(path, opts = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    ...opts,
    headers: { 'x-member-token': token, 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  if (res.status === 401) { localStorage.removeItem('bcToken'); localStorage.removeItem('bcMember'); location.href = 'login.html'; throw new Error('401'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Error de conexión');
  return data;
}
function esc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function noCover(img){ const d=document.createElement('div'); d.className=img.className.replace('object-cover','').trim()+' bg-noche-surface'; img.replaceWith(d); }
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function fmtFull(iso){ const d = new Date(iso); return `${d.getDate()} de ${MESES[d.getMonth()]} · ${d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}`; }

if (me) {
  document.getElementById('nav-avatar').textContent = me.name[0];
  document.getElementById('nav-avatar').style.background = me.avatar_color || '#d9a441';
  document.getElementById('nav-name').textContent = me.name;
}

const eventId = new URLSearchParams(location.search).get('id');
if (!eventId) location.href = 'index.html';

let ev = null;
let picked = null; // book selected from Open Library search

async function load(){
  try {
    ev = await api(`/api/events/${eventId}`);
    render();
  } catch (err) {
    if (err.message !== '401') document.getElementById('content').innerHTML = `<p class="text-orquidea">${esc(err.message)}</p>`;
  }
}

function render(){
  const c = document.getElementById('content');
  const mapLink = ev.location ? `<a class="text-caliz hover:underline" target="_blank" rel="noopener" href="https://maps.google.com/?q=${encodeURIComponent(ev.location + ' Amsterdam')}">${esc(ev.location)} ↗</a>` : 'Lugar por confirmar';

  let body = '';
  if (ev.status === 'planned') body = rsvpSection() + plannedSection();
  else if (ev.status === 'raffled') body = rsvpSection() + winnerSection('Este es el elegido — ¡a leer!');
  else if (ev.status === 'completed') body = winnerSection('El libro de este encuentro') + attendeesSection() + '<div id="event-photos-section" class="mt-6"></div>';
  else body = '<p class="text-crema-dim">Este evento fue cancelado.</p>';
  if (ev.status !== 'cancelled') body += '<div id="event-materials-section" class="mt-6"></div>';

  c.innerHTML = `
    <a href="index.html" class="text-crema-dim text-sm hover:text-crema">← volver</a>
    <header class="mt-4 mb-10">
      <p class="uppercase tracking-[0.3em] text-xs text-crema-dim mb-3">${ev.status === 'completed' ? 'encuentro pasado' : 'próximo encuentro'}</p>
      <h1 class="font-display text-4xl sm:text-5xl font-semibold">${esc(ev.title)}</h1>
      <div class="mt-4 space-y-1 text-crema-dim">
        <p>📅 ${fmtFull(ev.event_at)}</p>
        <p>📍 ${mapLink}</p>
        ${ev.theme ? `<p>🎭 Temática: <span class="text-orquidea font-semibold">${esc(ev.theme)}</span></p>` : ''}
        ${ev.status === 'planned' ? (ev.selection_method === 'vote'
          ? `<p class="text-caliz">🗳️ ${ev.vote_deadline ? `Votación abierta hasta el ${fmtFull(ev.vote_deadline)}` : 'El libro se elige por votación'}</p>`
          : (ev.raffle_at ? `<p class="text-caliz">🔮 Rifa: ${fmtFull(ev.raffle_at)}</p>` : '')) : ''}
      </div>
      ${ev.description ? `<p class="mt-4 text-crema-dim leading-relaxed">${esc(ev.description)}</p>` : ''}
    </header>
    ${body}`;

  if (ev.status === 'planned') wireSuggestionForm();
  if (['planned', 'raffled'].includes(ev.status)) wireRsvpButtons();
  if (ev.status === 'completed') loadEventPhotos();
  if (ev.status !== 'cancelled') loadEventMaterials();
}

// ── RSVP ─────────────────────────────────────────────────────────────────────

function rsvpSection() {
  const going = ev.my_rsvp === true;
  const notGoing = ev.my_rsvp === false;
  const goingCount = ev.rsvp_going?.length || 0;

  const avatars = (ev.rsvp_going || []).map(m =>
    `<span title="${esc(m.name)}" class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold text-noche-deep shrink-0" style="background:${esc(m.avatar_color || '#d9a441')}">${esc(m.name[0])}</span>`
  ).join('');

  const goingText = goingCount === 0
    ? 'Sé la primera en confirmar'
    : goingCount === 1
    ? '1 persona confirma asistencia'
    : `${goingCount} personas confirman asistencia`;

  return `
    <section class="bg-noche-surface border border-noche-line rounded-2xl sombra p-5 sm:p-6 mb-8">
      <div class="flex items-start justify-between gap-4 flex-wrap">
        <div class="min-w-0">
          <h2 class="font-display text-xl mb-0.5">¿Vas a venir?</h2>
          <p id="rsvp-going-text" class="text-sm text-crema-dim">${goingText}</p>
        </div>
        <div class="flex gap-2 shrink-0">
          <button id="rsvp-yes"
            class="px-4 py-2 rounded-xl text-sm font-bold border active:scale-[.97] transition-[transform,background-color,color,border-color] ${going ? 'bg-marigold text-noche-deep border-marigold' : 'border-noche-line text-crema-dim hover:border-marigold/60 hover:text-crema'}">
            Sí, iré 🙌
          </button>
          <button id="rsvp-no"
            class="px-4 py-2 rounded-xl text-sm font-bold border active:scale-[.97] transition-[transform,background-color,color,border-color] ${notGoing ? 'bg-orquidea/20 text-orquidea border-orquidea/50' : 'border-noche-line text-crema-dim hover:border-orquidea/40 hover:text-crema'}">
            No puedo 😔
          </button>
        </div>
      </div>
      ${goingCount > 0 ? `<div class="mt-4 flex items-center gap-2 flex-wrap">${avatars}</div>` : ''}
    </section>`;
}

async function wireRsvpButtons() {
  const yesBtn = document.getElementById('rsvp-yes');
  const noBtn  = document.getElementById('rsvp-no');
  if (!yesBtn || !noBtn) return;

  async function setRsvp(going) {
    yesBtn.disabled = true;
    noBtn.disabled  = true;
    try {
      await api(`/api/events/${eventId}/rsvp`, { method: 'PUT', body: JSON.stringify({ going }) });
      ev.my_rsvp = going;
      if (going) {
        if (!ev.rsvp_going.some(m => m.name === me?.name)) {
          ev.rsvp_going = [...(ev.rsvp_going || []), { name: me.name, avatar_color: me.avatar_color }];
        }
      } else {
        ev.rsvp_going = (ev.rsvp_going || []).filter(m => m.name !== me?.name);
      }
      render();
    } catch (e) {
      yesBtn.disabled = false;
      noBtn.disabled  = false;
    }
  }

  yesBtn.addEventListener('click', () => setRsvp(true));
  noBtn.addEventListener('click',  () => setRsvp(false));
}

// ── Planned: suggestion form + goblet status ─────────────────────────────────

function plannedSection(){
  const isVote = ev.selection_method === 'vote';
  const papers = Array.from({ length: ev.suggestion_count }, (_, i) =>
    `<span class="papelito inline-block w-8 h-6 bg-crema/15 border border-crema/20 rounded-sm" style="--rot:${(i % 2 ? 1 : -1) * (3 + i * 2)}deg; animation-delay:-${i * .8}s"></span>`).join('');

  const statusBox = isVote ? `
    <section class="bg-noche-surface border border-noche-line rounded-2xl sombra p-6 sm:p-8 mb-8">
      <div class="flex items-center justify-between gap-4 flex-wrap mb-1">
        <h2 class="font-display text-2xl">La votación está abierta</h2>
        <a href="votacion.html?id=${ev.id}" class="px-4 py-2 rounded-xl border border-caliz/40 text-caliz text-sm font-bold hover:bg-caliz/10 active:scale-[.98]">Ver la votación en vivo 🗳️</a>
      </div>
      <p class="text-crema-dim text-sm mb-5">${ev.suggestion_count} libro${ev.suggestion_count === 1 ? '' : 's'} en la papeleta. Cada miembro puede proponer varios libros y todas votan — el voto es público.</p>
      <div class="flex gap-3 flex-wrap min-h-[2rem]">${papers || '<span class="text-crema-dim text-sm italic">todavía no hay propuestas…</span>'}</div>
    </section>` : `
    <section class="bg-noche-surface border border-noche-line rounded-2xl sombra p-6 sm:p-8 mb-8">
      <div class="flex items-center justify-between gap-4 flex-wrap mb-1">
        <h2 class="font-display text-2xl">El cáliz espera</h2>
        <a href="rifa.html?id=${ev.id}" class="px-4 py-2 rounded-xl border border-caliz/40 text-caliz text-sm font-bold hover:bg-caliz/10 active:scale-[.98]">Ver el cáliz en vivo 🔥</a>
      </div>
      <p class="text-crema-dim text-sm mb-5">${ev.suggestion_count} papelito${ev.suggestion_count === 1 ? '' : 's'} dentro. Cada miembro puede proponer varios libros; la rifa decide.</p>
      <div class="flex gap-3 flex-wrap min-h-[2rem]">${papers || '<span class="text-crema-dim text-sm italic">todavía no hay propuestas…</span>'}</div>
    </section>`;

  return `
    ${statusBox}

    <section class="bg-noche-surface border border-noche-line rounded-2xl sombra p-6 sm:p-8">
      ${ev.locked ? `
        <div class="flex items-center gap-3 text-sm text-orquidea bg-orquidea/10 border border-orquidea/30 rounded-xl px-4 py-3 mb-6">
          <svg class="w-4 h-4 shrink-0" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5 7V5a3 3 0 0 1 6 0v2" stroke-linecap="round"/></svg>
          Las propuestas están bloqueadas — la votación ya comenzó.
        </div>
        ${(ev.my_suggestions || []).length ? `
          <h2 class="font-display text-2xl mb-1">Tus propuestas</h2>
          <ul class="space-y-3 mt-4">
            ${(ev.my_suggestions || []).map(s => `
              <li class="flex items-center gap-4 bg-noche-deep rounded-xl p-4">
                <div class="cover-wrap w-14 shrink-0">${s.cover_url ? `<img src="${esc(s.cover_url)}" alt="" class="w-14 h-20 object-cover" onerror="noCover(this)">` : '<div class="w-14 h-20"></div>'}</div>
                <div class="flex-1 min-w-0">
                  <p class="font-semibold truncate">${esc(s.title)}</p>
                  <p class="text-sm text-crema-dim">${esc(s.author || '')}</p>
                </div>
                <span class="text-marigold text-lg shrink-0">✓</span>
              </li>`).join('')}
          </ul>` : ''}` : `
        ${(ev.my_suggestions || []).length ? `
          <h2 class="font-display text-2xl mb-1">Tus propuestas</h2>
          <p class="text-crema-dim text-sm mb-4">${isVote ? 'Puedes quitar o añadir más hasta que haya votos.' : 'Puedes quitar o añadir más hasta la rifa.'}</p>
          <ul id="my-sug-list" class="space-y-3 mb-7">
            ${(ev.my_suggestions || []).map((s, i) => `
              <li class="sug-item flex items-center gap-4 bg-noche-deep rounded-xl p-4" style="animation-delay:${i * 60}ms" data-sug-id="${esc(s.suggestion_id)}">
                <div class="cover-wrap w-14 shrink-0">${s.cover_url ? `<img src="${esc(s.cover_url)}" alt="" class="w-14 h-20 object-cover" onerror="noCover(this)">` : '<div class="w-14 h-20"></div>'}</div>
                <div class="flex-1 min-w-0">
                  <p class="font-semibold truncate">${esc(s.title)}</p>
                  <p class="text-sm text-crema-dim">${esc(s.author || '')}</p>
                </div>
                <button class="remove-sug shrink-0 w-8 h-8 flex items-center justify-center rounded-lg text-crema-dim hover:text-orquidea hover:bg-orquidea/10 active:scale-95 transition-[color,background-color]"
                  data-id="${esc(s.suggestion_id)}" aria-label="Quitar propuesta">
                  <svg class="w-4 h-4 pointer-events-none" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 4h12M5 4V2h6v2M6 7v5M10 7v5M3 4l1 9h8l1-9" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </li>`).join('')}
          </ul>` : ''}
        <h2 class="font-display text-2xl mb-1">${(ev.my_suggestions || []).length ? 'Agregar otra propuesta' : 'Propón tu libro'}</h2>
        <p class="text-crema-dim text-sm mb-5">${(ev.my_suggestions || []).length ? 'Cuantos más libros propongas, más rico el debate.' : (isVote ? 'Puedes proponer uno o varios libros.' : 'Busca por título o rellena a mano.')}</p>
        ${formHTML()}`}
    </section>`;
}

function formHTML(){
  return `
    <div class="relative">
      <input id="search" type="text" placeholder="Busca por título o autor…"
        class="w-full bg-noche-deep border border-noche-line rounded-xl p-3 pr-24 text-sm placeholder:text-crema-dim/60 focus:border-marigold/60 focus:outline-none">
      <button id="search-btn" class="absolute right-2 top-1/2 -translate-y-1/2 px-3 py-1.5 rounded-lg bg-marigold text-noche-deep text-sm font-bold hover:brightness-110 active:scale-[.97]">Buscar</button>
    </div>
    <div id="search-results" class="mt-3 space-y-2"></div>
    <div id="picked-preview" class="hidden mt-4 flex items-center gap-4 bg-noche-deep border border-marigold/40 rounded-xl p-4"></div>

    <details class="mt-5"><summary class="cursor-pointer text-sm text-crema-dim hover:text-crema">O rellénalo a mano</summary>
      <div class="grid sm:grid-cols-2 gap-3 mt-4">
        <input id="f-title" placeholder="Título *" class="bg-noche-deep border border-noche-line rounded-xl p-3 text-sm placeholder:text-crema-dim/60 focus:border-marigold/60 focus:outline-none">
        <input id="f-author" placeholder="Autor/a" class="bg-noche-deep border border-noche-line rounded-xl p-3 text-sm placeholder:text-crema-dim/60 focus:border-marigold/60 focus:outline-none">
        <input id="f-year" placeholder="Año" inputmode="numeric" class="bg-noche-deep border border-noche-line rounded-xl p-3 text-sm placeholder:text-crema-dim/60 focus:border-marigold/60 focus:outline-none">
        <input id="f-cover" placeholder="URL de la portada" class="bg-noche-deep border border-noche-line rounded-xl p-3 text-sm placeholder:text-crema-dim/60 focus:border-marigold/60 focus:outline-none">
      </div>
      <textarea id="f-description" placeholder="Sinopsis (opcional)" rows="3"
        class="mt-3 w-full bg-noche-deep border border-noche-line rounded-xl p-3 text-sm placeholder:text-crema-dim/60 focus:border-marigold/60 focus:outline-none resize-none leading-relaxed"></textarea>
    </details>

    <div class="mt-6 flex items-center gap-3">
      <button id="submit-btn" class="px-6 py-3 rounded-xl bg-marigold text-noche-deep font-bold text-sm hover:brightness-110 active:scale-[.98] transition-[filter]">Confirmar</button>
      <span id="form-status" class="text-sm text-crema-dim"></span>
    </div>`;
}

function wireSuggestionForm(){
  const searchBtn = document.getElementById('search-btn');
  if (!searchBtn) return;

  document.getElementById('search').addEventListener('keydown', e => { if (e.key === 'Enter') searchBtn.click(); });

  searchBtn.addEventListener('click', async () => {
    const q = document.getElementById('search').value.trim();
    if (!q) return;
    const box = document.getElementById('search-results');
    box.innerHTML = '<p class="text-crema-dim text-sm py-2">Buscando…</p>';
    try {
      const res = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=5&fields=title,author_name,first_publish_year,cover_i,isbn,key`);
      const data = await res.json();
      if (!data.docs?.length) { box.innerHTML = '<p class="text-crema-dim text-sm py-2">Nada encontrado — rellénalo a mano abajo.</p>'; return; }
      box.innerHTML = data.docs.map((d, i) => `
        <button class="result w-full flex items-center gap-3 bg-noche-deep border border-noche-line rounded-xl p-3 text-left hover:border-marigold/50 active:scale-[.99]" data-i="${i}">
          ${d.cover_i ? `<img src="https://covers.openlibrary.org/b/id/${d.cover_i}-S.jpg" alt="" class="w-9 h-13 object-cover rounded" onerror="noCover(this)">` : '<span class="w-9 h-13 bg-noche-surface rounded shrink-0"></span>'}
          <span class="min-w-0"><span class="block text-sm font-semibold truncate">${esc(d.title)}</span>
          <span class="block text-xs text-crema-dim truncate">${esc((d.author_name || []).join(', '))}${d.first_publish_year ? ` · ${d.first_publish_year}` : ''}</span></span>
        </button>`).join('');
      box.querySelectorAll('.result').forEach(btn => btn.addEventListener('click', () => {
        const d = data.docs[Number(btn.dataset.i)];
        picked = {
          title: d.title,
          author: (d.author_name || [])[0] || null,
          year: d.first_publish_year || null,
          isbn: (d.isbn || [])[0] || null,
          cover_url: d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg` : null,
          description: null,
        };
        if (d.key) {
          fetch(`https://openlibrary.org${d.key}.json`)
            .then(r => r.ok ? r.json() : null)
            .then(work => {
              if (!work || !picked) return;
              const raw = work.description;
              picked.description = raw ? (typeof raw === 'string' ? raw : raw.value || null) : null;
            })
            .catch(() => {});
        }
        box.innerHTML = '';
        const prev = document.getElementById('picked-preview');
        prev.classList.remove('hidden');
        prev.innerHTML = `
          ${picked.cover_url ? `<img src="${esc(picked.cover_url)}" alt="" class="w-14 h-20 object-cover rounded" onerror="noCover(this)">` : ''}
          <div class="min-w-0"><p class="font-semibold truncate">${esc(picked.title)}</p><p class="text-sm text-crema-dim">${esc(picked.author || '')}${picked.year ? ` · ${picked.year}` : ''}</p></div>
          <span class="ml-auto text-marigold">listo ✓</span>`;
      }));
    } catch {
      box.innerHTML = '<p class="text-orquidea text-sm py-2">No se pudo buscar — rellénalo a mano abajo.</p>';
    }
  });

  document.getElementById('submit-btn').addEventListener('click', async () => {
    const status = document.getElementById('form-status');
    const manual = document.getElementById('f-title')?.value.trim();
    const body = manual
      ? { title: manual, author: document.getElementById('f-author').value.trim() || null, year: document.getElementById('f-year').value.trim() || null, cover_url: document.getElementById('f-cover').value.trim() || null, description: document.getElementById('f-description').value.trim() || null }
      : picked;
    if (!body?.title) { status.textContent = 'Busca un libro o escribe el título a mano.'; return; }
    status.textContent = ev.selection_method === 'vote' ? 'Sumando a la papeleta…' : 'Echando al cáliz…';
    try {
      await api(`/api/events/${eventId}/suggestion`, { method: 'POST', body: JSON.stringify(body) });
      status.textContent = '';
      picked = null;
      const searchInput = document.getElementById('search');
      if (searchInput) searchInput.value = '';
      const searchResults = document.getElementById('search-results');
      if (searchResults) searchResults.innerHTML = '';
      const pickedPreview = document.getElementById('picked-preview');
      if (pickedPreview) pickedPreview.classList.add('hidden');
      load();
    } catch (e) { status.textContent = e.message; }
  });

  wireRemoveButtons();
}

function wireRemoveButtons() {
  document.querySelectorAll('.remove-sug').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (btn.disabled) return;
      btn.disabled = true;
      const sugId = btn.dataset.id;
      try {
        await api(`/api/events/${eventId}/suggestion/${sugId}`, { method: 'DELETE' });
        load();
      } catch (e) {
        btn.disabled = false;
        const status = document.getElementById('form-status');
        if (status) status.textContent = e.message;
      }
    });
  });
}

// ── Winner + attendees ────────────────────────────────────────────────────────

function winnerSection(label){
  if (!ev.winning_book) return '';
  const b = ev.winning_book;
  return `
    <section class="bg-crema text-noche rounded-2xl sombra-crema p-6 sm:p-8 mb-8" style="transform:rotate(-.4deg)">
      <p class="text-xs uppercase tracking-[0.25em] text-orquidea mb-4">${label}</p>
      <div class="flex gap-5 items-start">
        <div class="w-24 sm:w-28 shrink-0 rounded-lg overflow-hidden shadow-lg">${b.cover_url ? `<img src="${esc(b.cover_url)}" alt="" class="w-full aspect-[2/3] object-cover" onerror="noCover(this)">` : ''}</div>
        <div>
          <h2 class="font-display text-2xl sm:text-3xl font-semibold leading-tight">${esc(b.title)}</h2>
          <p class="text-noche/70 mt-1">${esc(b.author || '')}${b.year ? ` · ${b.year}` : ''}</p>
          ${ev.suggested_by ? (ev.selection_method === 'vote'
            ? `<p class="mt-3 text-sm">🗳️ elegido por votación — propuesto por <strong>${esc(ev.suggested_by)}</strong></p>`
            : `<p class="mt-3 text-sm">🔥 salió del cáliz gracias a <strong>${esc(ev.suggested_by)}</strong></p>`) : ''}
          ${b.description ? `<p class="mt-3 text-sm text-noche/70 leading-relaxed">${esc(b.description)}</p>` : ''}
        </div>
      </div>
    </section>`;
}

function attendeesSection(){
  if (!ev.attendees?.length) return '';
  return `
    <section class="bg-noche-surface border border-noche-line rounded-2xl sombra p-6 sm:p-8">
      <h2 class="font-display text-2xl mb-4">Estuvieron ahí</h2>
      <div class="flex flex-wrap gap-2">
        ${ev.attendees.map(a => `<span class="inline-flex items-center gap-2 bg-noche-deep border border-noche-line rounded-full pl-1 pr-3 py-1 text-sm">
          <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold text-noche-deep" style="background:${esc(a.avatar_color || '#d9a441')}">${esc(a.name[0])}</span>${esc(a.name)}</span>`).join('')}
      </div>
    </section>`;
}

async function loadEventMaterials(){
  try {
    const materials = await api(`/api/events/${eventId}/materials`);
    const box = document.getElementById('event-materials-section');
    if (!box || !materials.length) return;
    const ICON = {
      'application/pdf': '📄',
      'application/epub+zip': '📖',
      'application/vnd.openxmlformats-officedocument.presentationml.presentation': '📊',
    };
    const EXT_LABEL = {
      'application/pdf': 'PDF',
      'application/epub+zip': 'EPUB',
      'application/vnd.openxmlformats-officedocument.presentationml.presentation': 'PPTX',
    };
    box.innerHTML = `
      <section class="bg-noche-surface border border-noche-line rounded-2xl sombra p-6 sm:p-8">
        <h2 class="font-display text-2xl mb-4">Materiales del evento</h2>
        <ul class="space-y-3">
          ${materials.map(m => `
            <li class="flex items-center gap-4 bg-noche-deep border border-noche-line rounded-xl px-4 py-3">
              <span class="text-2xl shrink-0" aria-hidden="true">${ICON[m.mime_type] || '📎'}</span>
              <div class="flex-1 min-w-0">
                <p class="font-semibold truncate">${esc(m.title)}</p>
                <p class="text-xs text-crema-dim uppercase tracking-wide">${EXT_LABEL[m.mime_type] || 'archivo'}</p>
              </div>
              ${m.url
                ? `<a href="${esc(m.url)}" download class="btn btn-ghost text-sm shrink-0 px-4 py-2">Descargar</a>`
                : '<span class="text-xs text-crema-dim">no disponible</span>'}
            </li>`).join('')}
        </ul>
      </section>`;
  } catch { /* materials are optional, fail silently */ }
}

async function loadEventPhotos(){
  try {
    const photos = await api(`/api/events/${eventId}/photos`);
    const box = document.getElementById('event-photos-section');
    if (!box || !photos.length) return;
    box.innerHTML = `
      <section class="bg-noche-surface border border-noche-line rounded-2xl sombra p-6 sm:p-8">
        <h2 class="font-display text-2xl mb-4">Fotos del encuentro</h2>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
          ${photos.map(p => `
            <figure class="rounded-xl overflow-hidden sombra">
              <img src="${esc(p.url)}" class="w-full aspect-[4/3] object-cover" alt="${esc(p.caption || '')}" loading="lazy" onerror="this.style.display='none'">
              ${p.caption ? `<figcaption class="px-3 py-2 text-xs text-crema-dim font-display italic">${esc(p.caption)}</figcaption>` : ''}
            </figure>`).join('')}
        </div>
      </section>`;
  } catch { /* photos are optional, fail silently */ }
}

load();
</script>
<script>
(function(){
  const btn  = document.getElementById('nav-hamburger');
  const menu = document.getElementById('nav-mobile-menu');
  if (!btn || !menu) return;
  const iM = document.getElementById('icon-menu');
  const iC = document.getElementById('icon-close');
  function close() {
    menu.classList.add('hidden');
    btn.setAttribute('aria-expanded','false');
    iM.classList.remove('hidden');
    iC.classList.add('hidden');
  }
  btn.addEventListener('click', e => {
    e.stopPropagation();
    const nowHidden = menu.classList.toggle('hidden');
    btn.setAttribute('aria-expanded', String(!nowHidden));
    iM.classList.toggle('hidden', !nowHidden);
    iC.classList.toggle('hidden', nowHidden);
  });
  menu.querySelectorAll('a').forEach(a => a.addEventListener('click', close));
  document.addEventListener('click', e => {
    if (!btn.contains(e.target) && !menu.contains(e.target)) close();
  });
})();
</script>
