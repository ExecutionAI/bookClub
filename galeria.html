  .photo-card {
    break-inside: avoid;
    transition: transform .25s ease, box-shadow .25s ease, z-index 0s;

  /* Tape corner decoration (top-center) */
  .photo-card::before {
    content: '';
    position: absolute;
    top: -7px;
    left: 50%;
    transform: translateX(-50%);
    width: 36px;
    height: 14px;
    background: rgba(245,201,107,.22);
    border-radius: 2px;
    backdrop-filter: blur(2px);
    border: 1px solid rgba(245,201,107,.18);
    z-index: 1;

    0%,100% { opacity:.35; }

  }
  .shimmer { animation: shimmer 1.6s ease-in-out infinite; }

  .photo-img {
    opacity: 0;
    transition: opacity .5s ease;
  }
  .photo-img.loaded { opacity: 1; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none!important; transition:none!important; } }

<main class="max-w-6xl mx-auto px-5 pb-24">

  <header class="pt-14 pb-12 text-center relative">
    <p class="uppercase tracking-[0.3em] text-xs text-crema-dim mb-4">Entre bicis y libros</p>
    <h1 class="font-display text-5xl sm:text-6xl font-semibold" style="font-variation-settings:'opsz' 120;">
      El álbum del club
    </h1>
    <div class="mt-3 flex items-center justify-center gap-3 text-crema-dim text-sm">
      <span class="text-marigold select-none">✦</span>
      <span id="gallery-subtitle">Cargando…</span>

    </div>
  </header>

  <div id="gallery" class="columns-2 sm:columns-3 lg:columns-4 gap-4"></div>

<script>
const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:3001' : 'https://entrebicisylibros.com';
const token = localStorage.getItem('bcToken');
const me = (() => { try { return JSON.parse(localStorage.getItem('bcMember')); } catch { return null; } })();

if (me) {
  document.getElementById('nav-avatar').textContent = me.name[0];
  document.getElementById('nav-avatar').style.background = me.avatar_color || '#d9a441';
  document.getElementById('nav-name').textContent = me.name;
}

async function api(path, opts = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    ...opts,
    headers: { 'x-member-token': token || '', 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  if (res.status === 401) { localStorage.removeItem('bcToken'); localStorage.removeItem('bcMember'); location.href = 'login.html'; throw new Error('401'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Error de conexión');
  return data;
}

function esc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fmtDate(iso){ if (!iso) return ''; const d = new Date(iso); return `${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`; }

const ROTS = ['-.7deg', '.5deg', '-1.2deg', '.8deg', '-1.5deg', '.4deg', '-.9deg', '1.1deg'];

async function load() {
  const gallery = document.getElementById('gallery');
  const subtitle = document.getElementById('gallery-subtitle');

  if (!token) {
    subtitle.textContent = '';
    gallery.innerHTML = `
      <div class="col-span-full text-center py-24">
        <p class="font-display text-2xl mb-3 text-crema-dim italic">El álbum es solo para el club</p>
        <p class="text-crema-dim text-sm mb-6">Inicia sesión para ver las fotos.</p>
        <a href="login.html" class="inline-block bg-marigold text-noche-deep font-bold text-sm px-6 py-3 rounded-xl hover:brightness-110 active:scale-[.98] transition-[filter]">Iniciar sesión</a>
      </div>`;
    return;
  }

  try {
    const photos = await api('/api/photos');

    if (!photos.length) {
      subtitle.textContent = 'El álbum está esperando su primera foto';
      gallery.innerHTML = `<p class="col-span-full text-center py-20 font-display italic text-crema-dim text-xl">Pronto habrá recuerdos aquí…</p>`;
      return;
    }

    const years = photos.map(p => new Date(p.uploaded_at).getFullYear());
    const minYear = Math.min(...years);
    subtitle.textContent = `${photos.length} foto${photos.length === 1 ? '' : 's'} · desde ${minYear}`;

    gallery.innerHTML = photos.map((p, i) => `
      <div class="photo-card mb-5 bg-noche-surface border border-noche-line rounded-2xl p-2.5 pb-3 sombra"
           style="transform: rotate(${ROTS[i % ROTS.length]})" data-photo-id="${p.id}">
        <div class="rounded-xl overflow-hidden bg-noche-deep shimmer" id="wrap-${p.id}"
             style="aspect-ratio:${i % 3 === 1 ? '3/4' : '4/3'}">
          <img class="photo-img w-full h-full object-cover" id="img-${p.id}" alt="${esc(p.caption || 'Foto del club')}" loading="lazy">
        </div>
        ${p.caption || p.event ? `
        <div class="px-1 pt-2.5 space-y-1">
          ${p.caption ? `<p class="font-display italic text-sm text-crema leading-tight">${esc(p.caption)}</p>` : ''}
          ${p.event ? `<p class="text-xs text-marigold/80">📅 ${esc(p.event.title)} · ${fmtDate(p.event.event_at)}</p>` : ''}
        </div>` : ''}
      </div>`).join('');

    // Lazy-load signed URLs as cards enter viewport
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(async entry => {
        if (!entry.isIntersecting) return;
        observer.unobserve(entry.target);
        const id = entry.target.dataset.photoId;
        if (!id) return;
        try {
          const { url } = await api(`/api/photos/${id}/url`);
          const img = document.getElementById(`img-${id}`);
          const wrap = document.getElementById(`wrap-${id}`);
          if (!img) return;
          img.onload = () => {
            img.classList.add('loaded');
            wrap?.classList.remove('shimmer');
          };
          img.src = url;
        } catch { /* skip — don't break the rest */ }
      });
    }, { rootMargin: '250px 0px' });

    document.querySelectorAll('.photo-card[data-photo-id]').forEach(card => observer.observe(card));

  } catch (err) {
    if (err.message !== '401') {
      subtitle.textContent = '';
      gallery.innerHTML = `<p class="col-span-full text-center py-8 text-orquidea">${esc(err.message)}</p>`;
    }
  }
}

load();
</script>
<script>
(function(){
  const btn  = document.getElementById('nav-hamburger');
  const menu = document.getElementById('nav-mobile-menu');
  if (!btn || !menu) return;
  const iM = document.getElementById('icon-menu');
  const iC = document.getElementById('icon-close');
  function close() {
    menu.classList.add('hidden');
    btn.setAttribute('aria-expanded','false');
    iM.classList.remove('hidden');
    iC.classList.add('hidden');
  }
  btn.addEventListener('click', e => {
    e.stopPropagation();
    const nowHidden = menu.classList.toggle('hidden');
    btn.setAttribute('aria-expanded', String(!nowHidden));
    iM.classList.toggle('hidden', !nowHidden);
    iC.classList.toggle('hidden', nowHidden);
  });
  document.addEventListener('click', close);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
})();
</script>
